# Enable reloading this file with <prefix> + r
unbind r
bind r source-file ~/.tmux.conf

set -g mouse on
set -g set-clipboard on

# ZSH and True colors
set-option -g default-shell /bin/zsh
run "[ -f ~/.fzf.zsh ] && source ~/.fzf.zsh"
set-option -sa terminal-overrides ",xterm*:Tc"

# Override default prefix
set -g prefix C-s

# Vi mode for copy mode
set-window-option -g mode-keys vi

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Colors
bg="#343f44"
active_bg="#475258"
fg="#d3c6aa"
green="#a7c980"
yellow="#dbbc7f"
blue="#7fbbb3"
red="#e67e80"

# Status bar colors
set -g status-style "bg=$bg,fg=$fg"
set -g status-position top
set -g status-left-length 100
set -g status-right-length 100

# Left side: Session name with prefix indicator
set -g status-left "#[bg=$green,fg=#232a2e,bold] #{?client_prefix,󰠠 ,}#S #[bg=$bg,fg=$green]"

# Window status format (inactive)
set -g window-status-format "#[fg=$fg] #I #W "

# Window status format (active)
set -g window-status-current-format "#[bg=$active_bg,fg=$fg,bold] #I #W #[bg=$bg,fg=$active_bg]"

# Right side: Time
set -g status-right "#[fg=$green]#[bg=$green,fg=#232a2e,bold] %H:%M "

# Pane border colors
set -g pane-border-style "fg=#3d484d"
set -g pane-active-border-style "fg=$green"

# Message colors
set -g message-style "bg=$active_bg,fg=$fg"
set -g message-command-style "bg=$active_bg,fg=$fg"

# Customize the status line
set -g status-position top
set -g status-interval 1

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
